<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>สมัครสมาชิก | KIWI</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <!-- ========================= -->
    <!-- Navbar -->
    <!-- ========================= -->

    <header class="navbar">
      <div class="nav-container">
        <a href="index.html" class="brand">
          <img src="images/logo_kiwi.png" alt="KIWI Logo" class="brand-logo" />

          <span>ระบบจัดการสหกิจศึกษา</span>
        </a>

        <div class="auth-buttons">
          <a href="login.html" class="btn-login"> มีบัญชีแล้ว? เข้าสู่ระบบ </a>
        </div>
      </div>
    </header>

    <!-- ========================= -->
    <!-- Register -->
    <!-- ========================= -->

    <main
      class="auth-wrapper"
      style="display: flex; align-items: center; justify-content: center"
    >
      <div class="auth-card">
        <div class="auth-header">
          <h2>สมัครสมาชิก</h2>

          <p>สมัครใช้งานระบบ KIWI สำหรับนักศึกษาสหกิจศึกษา</p>
        </div>

        <!-- ========================= -->
        <!-- Register Form -->
        <!-- ========================= -->

        <form
          class="auth-form"
          onsubmit="
            event.preventDefault();

            if (this.regPassword.value !== this.regConfirm.value) {
              alert('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน');
              return;
            }

            handleRegister(this.regEmail.value.trim(), this.regPassword.value);
          "
        >
          <div class="form-group">
            <label for="regEmail"> อีเมลมหาวิทยาลัย </label>

            <div
              class="input-icon-wrapper"
              style="display: flex; align-items: center"
            >
              <i class="fa-solid fa-envelope input-icon"></i>

              <input
                type="email"
                id="regEmail"
                name="regEmail"
                placeholder="เช่น s6501234567@email.kmutnb.ac.th"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="regPassword"> รหัสผ่าน </label>

            <div
              class="input-icon-wrapper"
              style="display: flex; align-items: center"
            >
              <i class="fa-solid fa-lock input-icon"></i>

              <input
                type="password"
                id="regPassword"
                name="regPassword"
                placeholder="อย่างน้อย 8 ตัวอักษร"
                minlength="8"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="regConfirm"> ยืนยันรหัสผ่าน </label>

            <div
              class="input-icon-wrapper"
              style="display: flex; align-items: center"
            >
              <i class="fa-solid fa-lock input-icon"></i>

              <input
                type="password"
                id="regConfirm"
                name="regConfirm"
                placeholder="กรอกรหัสผ่านอีกครั้ง"
                required
              />
            </div>
          </div>

          <label
            class="remember-me"
            style="
              display: flex;
              align-items: flex-start;
              font-size: 0.82rem;
              color: var(--text-muted);
            "
          >
            <input type="checkbox" required style="margin-top: 3px" />

            <span>
              ฉันยอมรับ
              <a href="#"> เงื่อนไขการใช้งาน </a>
              และนโยบายความเป็นส่วนตัวของระบบ
            </span>
          </label>

          <button type="submit" class="btn-submit">
            <i class="fa-solid fa-user-plus"></i>
            สมัครสมาชิก
          </button>
        </form>

        <p class="auth-footer">
          มีบัญชีผู้ใช้งานอยู่แล้ว?

          <a href="login.html"> เข้าสู่ระบบที่นี่ </a>
        </p>
      </div>
    </main>

    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <footer class="footer">
      <div class="footer-copyright">
        <p>© KIWI — Co-operative Education Management System</p>
      </div>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>

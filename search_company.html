      // ==========================================
      // 3. ตั้งค่าระบบแบ่งหน้า (Pagination)
      // ==========================================
      const itemsPerPage = 12; // 4 คอลัมน์ x 3 แถว = 12 การ์ด
      let currentPage = 1;
      const totalPages = Math.ceil(allJobs.length / itemsPerPage);

      const gridContainer = document.getElementById("searchGridContainer");
      const paginationControls = document.getElementById("paginationControls");
      const pageTotalText = document.getElementById("pageTotalText");

      // ==========================================
      // ฟังก์ชันสำหรับคลิกดูรายละเอียด
      // ==========================================
      window.viewJobDetail = function (jobId) {
        const job = allJobs.find((j) => j.id === jobId);
        if (job) {
          localStorage.setItem("currentViewJob", JSON.stringify(job));
          window.location.href = "job_detail.html";
        }
      };

      // 4. ฟังก์ชัน Render การ์ด
      function renderJobs(page) {
        gridContainer.innerHTML = "";
        const startIndex = (page - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const currentJobs = allJobs.slice(startIndex, endIndex);

        currentJobs.forEach((job) => {
          const tagsHTML = job.tags
            .map(
              (t) =>
                `<span class="tag ${t === "ฝึกงาน" ? "tag-green" : t === "Work from Home" ? "tag-dark" : "tag-red"}">${t}</span>`,
            )
            .join("");

          // เช็คว่าถ้าเป็นงานที่เพิ่งโพสต์ ให้เปลี่ยนป้ายเป็น "มาใหม่" (สีแดง)
          const badgeHTML =
            job.time === "เพิ่งโพสต์"
              ? `<div class="recommend-badge" style="background-color: #0B1220;">มาใหม่</div>`
              : `<div class="recommend-badge">แนะนำ</div>`;

          // เพิ่ม onclick และ cursor: pointer เพื่อให้กดไปดูรายละเอียดได้
          const cardHTML = `
          <div class="search-job-card" style="cursor: pointer;" onclick="window.viewJobDetail(${job.id})">
            ${badgeHTML}
            <div class="card-company-header">
              <div class="company-logo-box">
                <i class="${job.icon}"></i>
              </div>
              <div class="company-info-text">
                <div class="c-name">
                  <i class="fa-solid fa-circle-check text-green"></i> ${job.company}
                </div>
                <div class="c-loc">${job.location}</div>
              </div>
            </div>
            <h3 class="j-title">${job.title}</h3>
            <div class="j-tags">
              ${tagsHTML}
            </div>
            <div class="j-details" style="margin-bottom: 0;">
              <p>หมวดหมู่ : ${job.category}</p>
              <p>จำนวนรับสมัคร : ${job.quota}</p>
              <p class="j-salary">เบี้ยเลี้ยง : <span>${job.salary}</span></p>
            </div>
          </div>
        `;
          gridContainer.innerHTML += cardHTML;
        });

        renderPagination();
      }

      // 5. ฟังก์ชัน Render ปุ่มแบ่งหน้า
      function renderPagination() {
        paginationControls.innerHTML = "";

        const prevBtn = document.createElement("button");
        prevBtn.className = "page-nav";
        prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
        prevBtn.onclick = () => {
          if (currentPage > 1) {
            currentPage--;
            renderJobs(currentPage);
          }
        };
        paginationControls.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
          const pageBtn = document.createElement("button");
          pageBtn.className = `page-num ${i === currentPage ? "active" : ""}`;
          pageBtn.innerText = i;
          pageBtn.onclick = () => {
            currentPage = i;
            renderJobs(currentPage);
          };
          paginationControls.appendChild(pageBtn);
        }

        const nextBtn = document.createElement("button");
        nextBtn.className = "page-nav";
        nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
        nextBtn.onclick = () => {
          if (currentPage < totalPages) {
            currentPage++;
            renderJobs(currentPage);
          }
        };
        paginationControls.appendChild(nextBtn);

        pageTotalText.innerText = `ทั้งหมด ${totalPages} หน้า (${allJobs.length} ตำแหน่ง)`;
      }

      // เริ่มทำงานเมื่อเปิดหน้า
      document.addEventListener("DOMContentLoaded", () => {
        renderJobs(currentPage);
      });
    </script>
  </body>
</html>
